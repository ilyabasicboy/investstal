<div class="switcher {% if form.flag.errors %} error{% endif %}">
    <div class="switcher__title">Выберите зелёный, если вы не робот:</div>
    <div class="switcher__list">
        <span class="switcher__item switcher__item--green switch on{% if form.flag.data == 'on' %} active{% endif %}"></span>
        <span class="switcher__item switcher__item--red switch fake1{% if form.flag.data == 'fake1' %} active{% endif %}"></span>
        <span class="switcher__item switcher__item--yellow switch fake2{% if form.flag.data == 'fake2' %} active{% endif %}"></span>
    </div>
</div>
